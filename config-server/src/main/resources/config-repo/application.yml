management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

internal:
  api-key: ${INTERNAL_API_KEY:devhub-local-internal-key}
  http:
    connect-timeout-ms: ${INTERNAL_HTTP_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${INTERNAL_HTTP_READ_TIMEOUT_MS:5000}

spring:
  kafka:
    producer:
      acks: all
      enable-idempotence: true
      retries: ${KAFKA_PRODUCER_RETRIES:10}
      delivery-timeout-ms: ${KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS:120000}
