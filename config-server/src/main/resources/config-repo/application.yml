management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

internal:
  api-key: ${INTERNAL_API_KEY:devhub-local-internal-key}
  http:
    connect-timeout-ms: ${INTERNAL_HTTP_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${INTERNAL_HTTP_READ_TIMEOUT_MS:5000}
