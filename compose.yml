name: devhub

x-business-environment: &business-environment
  SERVER_PORT: 8080
  SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8080
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8080/eureka/
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:-devhub-local-internal-key}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-bG9jYWwtZGV2ZWxvcG1lbnQtand0LXNlY3JldC1rZXktZm9yLXRlc3Rpbmc=}

x-business-dependencies: &business-dependencies
  config-server:
    condition: service_healthy
  discovery-server:
    condition: service_healthy

x-business-healthcheck: &business-healthcheck
  test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health/readiness"]
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 20s

services:
  kafka:
    image: bitnami/kafka:3.9
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  config-server:
    build:
      context: .
      args:
        SERVICE: config-server
    ports:
      - "8888:8080"
    environment:
      SERVER_PORT: 8080
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 20

  discovery-server:
    build:
      context: .
      args:
        SERVICE: discovery-server
    ports:
      - "8761:8080"
    environment:
      SERVER_PORT: 8080
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 20

  auth-server:
    build:
      context: .
      args:
        SERVICE: auth-server
    ports:
      - "8081:8080"
    environment: *business-environment
    depends_on: *business-dependencies
    healthcheck: *business-healthcheck

  member-server:
    build:
      context: .
      args:
        SERVICE: member-server
    ports:
      - "8082:8080"
    environment: *business-environment
    depends_on: *business-dependencies
    healthcheck: *business-healthcheck

  project-server:
    build:
      context: .
      args:
        SERVICE: project-server
    ports:
      - "8083:8080"
    environment:
      <<: *business-environment
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      <<: *business-dependencies
      kafka:
        condition: service_healthy
    healthcheck: *business-healthcheck

  community-server:
    build:
      context: .
      args:
        SERVICE: community-server
    ports:
      - "8084:8080"
    environment: *business-environment
    depends_on: *business-dependencies
    healthcheck: *business-healthcheck

  admin-server:
    build:
      context: .
      args:
        SERVICE: admin-server
    ports:
      - "8085:8080"
    environment: *business-environment
    depends_on: *business-dependencies
    healthcheck: *business-healthcheck

  media-server:
    build:
      context: .
      args:
        SERVICE: media-server
    ports:
      - "8086:8080"
    environment:
      <<: *business-environment
      FILE_STORAGE_ROOT_PATH: /tmp/devhub-media
    tmpfs:
      - /tmp/devhub-media
    depends_on: *business-dependencies
    healthcheck: *business-healthcheck

  notification-server:
    build:
      context: .
      args:
        SERVICE: notification-server
    ports:
      - "8087:8080"
    environment:
      <<: *business-environment
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      <<: *business-dependencies
      kafka:
        condition: service_healthy
    healthcheck: *business-healthcheck

  query-server:
    build:
      context: .
      args:
        SERVICE: query-server
    ports:
      - "8088:8080"
    environment:
      <<: *business-environment
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      <<: *business-dependencies
      kafka:
        condition: service_healthy
    healthcheck: *business-healthcheck

  gateway-server:
    build:
      context: .
      args:
        SERVICE: gateway-server
    ports:
      - "8080:8080"
    environment: *business-environment
    depends_on:
      <<: *business-dependencies
      auth-server:
        condition: service_healthy
      member-server:
        condition: service_healthy
      project-server:
        condition: service_healthy
      community-server:
        condition: service_healthy
      admin-server:
        condition: service_healthy
      media-server:
        condition: service_healthy
      notification-server:
        condition: service_healthy
      query-server:
        condition: service_healthy
    healthcheck: *business-healthcheck
