spring:
  profiles:
    active: standalone
  application:
    name: query-server
  config:
    import: optional:configserver:http://localhost:8888
  mail:
    host: localhost
    port: 2525
  datasource:
    url: jdbc:h2:mem:query
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${QUERY_KAFKA_GROUP_ID:query-project-projection}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
server:
  port: ${QUERY_SERVER_PORT:8088}
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
oauth:
  github:
    client-id: local-github-client
    client-secret: local-github-secret
    redirect-uri: http://localhost:8080/api/auth/oauth/github/callback
  google:
    client-id: local-google-client
    client-secret: local-google-secret
    redirect-uri: http://localhost:8080/api/auth/oauth/google/callback
  kakao:
    client-id: local-kakao-client
    client-secret: local-kakao-secret
    redirect-uri: http://localhost:8080/api/auth/oauth/kakao/callback
  naver:
    client-id: local-naver-client
    client-secret: local-naver-secret
    redirect-uri: http://localhost:8080/api/auth/oauth/naver/callback
jwt:
  secret:
    key: bG9jYWwtZGV2ZWxvcG1lbnQtand0LXNlY3JldC1rZXktZm9yLXRlc3Rpbmc=
events:
  kafka:
    topic: ${PROJECT_EVENTS_TOPIC:devhub.project.events}
query:
  home:
    project-source: ${QUERY_HOME_PROJECT_SOURCE:projection}
  application:
    kafka:
      group-id: ${QUERY_APPLICATION_KAFKA_GROUP_ID:query-project-application-projection}
