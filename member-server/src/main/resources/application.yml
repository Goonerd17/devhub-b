spring:
  profiles:
    active: standalone
  application:
    name: member-server
  config:
    import: optional:configserver:http://localhost:8888
  datasource:
    url: jdbc:h2:mem:member
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
server:
  port: ${MEMBER_SERVER_PORT:8082}
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
