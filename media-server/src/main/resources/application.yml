spring:
  application:
    name: media-server
  config:
    import: optional:configserver:http://localhost:8888
  datasource:
    url: jdbc:h2:mem:media
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
server:
  port: ${MEDIA_SERVER_PORT:8086}
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
file:
  storage:
    root-path: ./build/devhub-media
jwt:
  secret:
    key: ${JWT_SECRET_KEY:bG9jYWwtZGV2ZWxvcG1lbnQtand0LXNlY3JldC1rZXktZm9yLXRlc3Rpbmc=}
