spring:
  application:
    name: media-server
  config:
    import: optional:configserver:http://localhost:8888
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:media}
    driver-class-name: org.h2.Driver
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:create}
    open-in-view: false
server:
  port: ${MEDIA_SERVER_PORT:8086}
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
file:
  storage:
    root-path: ./build/devhub-media
jwt:
  secret:
    key: ${JWT_SECRET_KEY:bG9jYWwtZGV2ZWxvcG1lbnQtand0LXNlY3JldC1rZXktZm9yLXRlc3Rpbmc=}
