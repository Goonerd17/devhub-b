spring:
  profiles:
    active: standalone
  application:
    name: community-server
  config:
    import: optional:configserver:http://localhost:8888
  mail:
    host: localhost
    port: 2525
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:community}
    driver-class-name: org.h2.Driver
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:create}
    open-in-view: false
server:
  port: ${COMMUNITY_SERVER_PORT:8084}
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
oauth:
  github:
    client-id: local-github-client
    client-secret: local-github-secret
    redirect-uri: http://localhost:8085/api/auth/oauth/github/callback
  google:
    client-id: local-google-client
    client-secret: local-google-secret
    redirect-uri: http://localhost:8085/api/auth/oauth/google/callback
  kakao:
    client-id: local-kakao-client
    client-secret: local-kakao-secret
    redirect-uri: http://localhost:8085/api/auth/oauth/kakao/callback
  naver:
    client-id: local-naver-client
    client-secret: local-naver-secret
    redirect-uri: http://localhost:8085/api/auth/oauth/naver/callback

jwt:
