spring:
  profiles:
    active: standalone
  application:
    name: project-server
  config:
    import: optional:configserver:http://localhost:8888
  datasource:
    url: jdbc:h2:mem:project
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
server:
  port: ${PROJECT_SERVER_PORT:8083}
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
events:
  kafka:
    topic: ${PROJECT_EVENTS_TOPIC:devhub.project.events}
  outbox:
    poll-interval-ms: ${PROJECT_OUTBOX_POLL_INTERVAL_MS:1000}
    cleanup-interval-ms: ${PROJECT_OUTBOX_CLEANUP_INTERVAL_MS:3600000}
    retention-days: ${PROJECT_OUTBOX_RETENTION_DAYS:7}
