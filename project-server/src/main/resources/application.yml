spring:
  profiles:
    active: standalone
  application:
    name: project-server
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:project}
    driver-class-name: org.h2.Driver
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:create}
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      enable-idempotence: true
      retries: ${KAFKA_PRODUCER_RETRIES:10}
      delivery-timeout-ms: ${KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS:120000}
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
server:
  port: ${PROJECT_SERVER_PORT:8083}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
events:
  kafka:
    topic: ${PROJECT_EVENTS_TOPIC:devhub.project.events}
  outbox:
    poll-interval-ms: ${PROJECT_OUTBOX_POLL_INTERVAL_MS:1000}
    cleanup-interval-ms: ${PROJECT_OUTBOX_CLEANUP_INTERVAL_MS:3600000}
    retention-days: ${PROJECT_OUTBOX_RETENTION_DAYS:7}
