name: Backend services CI/CD

on:
  push:
    branches:
      - prd
  workflow_dispatch:

env:
  PROJECT: devhub
  TARGET_ENV: dev

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Test, package, and verify service boundaries
        run: ./gradlew test bootJar verifyServiceBoundaries --no-daemon

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Upload executable service jars
        uses: actions/upload-artifact@v4
        with:
          name: service-jars
          path: '*-server/build/libs/*-server.jar'
          if-no-files-found: error
          retention-days: 1

  publish-images:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-server
          - member-server
          - project-server
          - community-server
          - admin-server
          - media-server
          - notification-server
          - query-server
          - discovery-server
          - config-server
          - gateway-server

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download executable service jars
        uses: actions/download-artifact@v4
        with:
          name: service-jars

      - name: Generate image metadata
        shell: bash
        run: |
          BUILD_TAG="$(date +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          IMAGE_NAME="${{ secrets.DOCKERHUB_USERNAME }}/${PROJECT}-${{ matrix.service }}-${TARGET_ENV}"
          echo "BUILD_TAG=${BUILD_TAG,,}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push service image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            SERVICE=${{ matrix.service }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.BUILD_TAG }}
            ${{ env.IMAGE_NAME }}:latest

  deployment-note:
    needs: publish-images
    runs-on: ubuntu-latest
    steps:
      - name: Report deployment handoff
        run: |
          echo "All service images were published successfully."
          echo "Service-specific infrastructure manifests must select their matching image."
