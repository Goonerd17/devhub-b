plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '3.5.7'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'teamdevhub'
version = '0.0.1-SNAPSHOT'
description = 'DevHub Backend'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}

    configureEach {
		exclude group: 'commons-logging', module: 'commons-logging'
	}
}

repositories {
	mavenCentral()
}

allprojects {
	repositories {
		mavenCentral()
	}
}

dependencies {
	// Root는 소스가 없는 집계 프로젝트이며 기능 의존성을 선언하지 않는다.
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.withType(Test).configureEach {
	systemProperty "file.encoding", "UTF-8"
}

def querydslDir = layout.buildDirectory.dir("generated/querydsl").get().asFile

sourceSets {
	main {
		java {
			srcDir querydslDir
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	options.generatedSourceOutputDirectory.set(querydslDir)
	options.annotationProcessorPath = configurations.annotationProcessor
	options.compilerArgs += "-Xlint:deprecation"
	options.compilerArgs += "-parameters"
}

// Spring MVC resolves unnamed request parameters at runtime; keep parameter
// metadata enabled for every physical module, not only the root project.
subprojects {
	plugins.withId('java') {
		tasks.withType(JavaCompile).configureEach {
			options.compilerArgs += "-parameters"
		}
	}
}

clean.doLast {
	file(querydslDir).deleteDir()
}

jacoco {
	toolVersion = "0.8.10"
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required.set(true)
		csv.required.set(false)
		html.required.set(true)
	}
	afterEvaluate {
		classDirectories.setFrom(
				files(classDirectories.files.collect {
					fileTree(dir: it, exclude: [
							'**/Q*.class',
							'**/generated/**'
					])
				})
		)
	}
}

test {
	finalizedBy jacocoTestReport
}

bootJar {
	enabled = false
}

tasks.named('compileJava') {
	enabled = false
}
