plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '3.5.7'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'teamdevhub'
version = '0.0.1-SNAPSHOT'
description = 'DevHub Backend'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}

    configureEach {
		exclude group: 'commons-logging', module: 'commons-logging'
	}
}

repositories {
	mavenCentral()
}

allprojects {
	repositories {
		mavenCentral()
	}
}

dependencies {
	// Root는 소스가 없는 집계 프로젝트이며 기능 의존성을 선언하지 않는다.
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.withType(Test).configureEach {
	systemProperty "file.encoding", "UTF-8"
}

def querydslDir = layout.buildDirectory.dir("generated/querydsl").get().asFile

sourceSets {
	main {
		java {
			srcDir querydslDir
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	options.generatedSourceOutputDirectory.set(querydslDir)
	options.annotationProcessorPath = configurations.annotationProcessor
	options.compilerArgs += "-Xlint:deprecation"
	options.compilerArgs += "-parameters"
}

// Spring MVC resolves unnamed request parameters at runtime; keep parameter
// metadata enabled for every physical module, not only the root project.
subprojects {
	plugins.withId('java') {
		tasks.withType(JavaCompile).configureEach {
			options.compilerArgs += "-parameters"
		}
	}
}

def businessServiceNames = [
		'auth-server',
		'member-server',
		'project-server',
		'community-server',
		'admin-server',
		'media-server',
		'notification-server',
		'query-server'
] as Set

tasks.register('verifyServiceBoundaries') {
	group = 'verification'
	description = 'Rejects production Gradle dependencies between independently deployable business services.'
	doLast {
		def violations = []
		businessServiceNames.each { serviceName ->
			def serviceProject = project(":${serviceName}")
			['api', 'implementation'].each { configurationName ->
				serviceProject.configurations.findByName(configurationName)?.dependencies
						?.withType(org.gradle.api.artifacts.ProjectDependency)
						?.findAll { businessServiceNames.contains(it.dependencyProject.name) }
						?.each { dependency ->
							violations << "${serviceProject.path}:${configurationName} -> ${dependency.dependencyProject.path}"
						}
			}
		}
		if (!violations.isEmpty()) {
			throw new GradleException("Business-service production dependencies are forbidden:\n" + violations.join('\n'))
		}
	}
}

def independentlyRunnableServices = [
		'auth-server',
		'member-server',
		'project-server',
		'community-server',
		'admin-server',
		'notification-server',
		'query-server'
] as Set

tasks.register('verifyApplicationScanBoundaries') {
	group = 'verification'
	description = 'Rejects broad component scanning that would load another service into a runnable application.'
	doLast {
		def violations = []
		independentlyRunnableServices.each { serviceName ->
			fileTree("${serviceName}/src/main/java").matching { include '**/*Application.java' }.files.each { sourceFile ->
				def source = sourceFile.getText('UTF-8')
				if (source.contains('@SpringBootApplication') && source =~ /scanBasePackages\s*=\s*"teamdevhub\.devhub"/) {
					violations << "${serviceName}:${sourceFile.name} scans teamdevhub.devhub"
				}
			}
		}
		if (!violations.isEmpty()) {
			throw new GradleException('Runnable service scan boundaries are too broad:\n' + violations.join('\n'))
		}
	}
}

def servicePackageNames = [
		'auth-server'         : 'auth',
		'member-server'       : 'member',
		'project-server'      : 'project',
		'community-server'    : 'community',
		'admin-server'        : 'admin',
		'media-server'        : 'media',
		'notification-server' : 'notification',
		'query-server'        : 'query'
]

tasks.register('verifyProductionPackageBoundaries') {
	group = 'verification'
	description = 'Rejects production imports of another service internal package.'
	doLast {
		def violations = []
		servicePackageNames.each { serviceName, servicePackage ->
			fileTree("${serviceName}/src/main/java").matching { include '**/*.java' }.files.each { sourceFile ->
				def source = sourceFile.getText('UTF-8')
				servicePackageNames.each { foreignService, foreignPackage ->
					if (serviceName != foreignService
							&& source =~ /(?m)^\s*import\s+teamdevhub\.devhub\.${foreignPackage}\./) {
						violations << "${sourceFile}: imports ${foreignService} internal package"
					}
				}
			}
		}
		if (!violations.isEmpty()) {
			throw new GradleException('Production package boundary violations:\n' + violations.join('\n'))
		}
	}
}

tasks.named('check') {
	dependsOn tasks.named('verifyServiceBoundaries')
	dependsOn tasks.named('verifyApplicationScanBoundaries')
	dependsOn tasks.named('verifyProductionPackageBoundaries')
}

clean.doLast {
	file(querydslDir).deleteDir()
}

jacoco {
	toolVersion = "0.8.10"
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required.set(true)
		csv.required.set(false)
		html.required.set(true)
	}
	afterEvaluate {
		classDirectories.setFrom(
				files(classDirectories.files.collect {
					fileTree(dir: it, exclude: [
							'**/Q*.class',
							'**/generated/**'
					])
				})
		)
	}
}

test {
	finalizedBy jacocoTestReport
}

bootJar {
	enabled = false
}

tasks.named('compileJava') {
	enabled = false
}
