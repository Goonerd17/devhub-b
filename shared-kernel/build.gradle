plugins {
    id 'org.springframework.boot'
    id 'java-library'
}

repositories {
    mavenCentral()
}

dependencies {
    runtimeOnly 'com.h2database:h2:2.3.232'
    implementation 'org.springframework:spring-context:6.2.12'
    implementation 'org.springframework:spring-web:6.2.12'
    implementation 'org.springframework.boot:spring-boot-starter-webflux:3.5.7'
    implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa:3.5.7'
    implementation 'org.springframework.security:spring-security-core:6.5.3'
    implementation 'org.springframework.security:spring-security-crypto:6.5.3'
    implementation 'org.springframework.security:spring-security-web:6.5.3'
    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.1.0'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.19.2'

    compileOnly 'org.projectlombok:lombok:1.18.38'
    annotationProcessor 'org.projectlombok:lombok:1.18.38'
    annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api:3.0.0'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api:3.2.0'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testImplementation 'org.assertj:assertj-core:3.27.3'
    testImplementation 'org.springframework:spring-test:6.2.12'
    testImplementation 'jakarta.servlet:jakarta.servlet-api:6.1.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

bootJar { enabled = false }
bootRun { enabled = false }
